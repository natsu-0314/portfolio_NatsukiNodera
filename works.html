    <section class="works-sort-btn">
      <button class="c-btn sort-btn" data-name="all">ALL</button>

      <button class="c-btn sort-btn" data-name="web">Web</button>
    </section>

    <section id="works-list" class="wrapper">
        <ul class="works-list-category">
          <li data-category="banner">
            <a href="./works_ice.html" class="works-link">
                <img src="./images/works_banner_ice.jpg" alt="アイスクリームのバナー" class="works-list-img">
            </a>
            <p class="works-list-item">Banner design</p>
          </li>

          <li data-category="banner">
            <a href="./works_hamburger.html" class="works-link">

          <li data-category="web">

            <img src="./images/works_comingsoon.jpg" alt="" class="works-list-img">
            <p class="works-list-item">Coming soon</p>
          </li>

    <!-- コンタクト -->
    <section id="contact" class="wrapper">
      <h2 class="section-title">CONTACT</h2>
      <p class="contact-comment">当サイトをご覧いただきありがとうございます。<br>お気軽にお問い合わせください。</p>

      <form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSf5HYOLo8u0c01s0q7PHunGBhW-nnpUuCGMOAdmLwKAOx8yHQ/formResponse" method="POST"
      class="c-form">

        <div class="c-form__item">
          <label class="c-form__label" for="field-name">Name
            <span class="c-form__required"></span>
          </label>

          <input 
            name="entry.1679155740"
            class="c-form__input"
            id="field-name"
            type="text"
            required="required"
            placeholder=" "
            />
        </div>

        <div class="c-form__item">
          <label class="c-form__label" for="field-mail">Mail address
            <span class="c-form__required"></span>
          </label>

          <input 
            name="entry.1188341491"
            class="c-form__input"
            id="field-mail"
            type="email"
            required="required"
            placeholder=" "
            />
        </div>

        <div class="c-form__item">
          <label class="c-form__label" for="field-message">Message
            <span class="c-form__required"></span>
          </label>

          <textarea 
            name="entry.519046052"
            class="c-form__input"
            id="field-message"
            required="required"
            placeholder=" "
            ></textarea>
        </div>

        <div class="c-form__submit">
          <button type="submit" class="c-btn btn-submit">送信する</button>
        </div>
      </from>
    </section>
